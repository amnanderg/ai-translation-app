<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Translate Text</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Translate Your Text</h1>
    <form th:action="@{/translate}" th:object="${translationRequest}" method="post">
        <div class="form-group">
            <label for="fromLanguage">From Language:</label>
            <input type="text" id="fromLanguage" th:field="*{fromLanguage}" class="form-control" placeholder="e.g., en">
        </div>
        <div class="form-group">
            <label for="toLanguage">To Language:</label>
            <input type="text" id="toLanguage" th:field="*{toLanguage}" class="form-control" placeholder="e.g., fr">
        </div>
        <div class="form-group">
            <label for="text">Text:</label>
            <textarea id="text" th:field="*{text}" class="form-control" rows="5" placeholder="Enter text to translate"></textarea>
        </div>
        <button type="submit" class="btn btn-success">Translate</button>
        <a href="/history" class="btn btn-info ml-2">View History</a>
    </form>
</div>
</body>
</html>
