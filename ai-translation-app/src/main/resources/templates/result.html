<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Translation Results</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4"> Translation Result</h1>
    <div class="card">
        <div class="card-body">
            <p><strong>From:</strong> <span th:text="${translationResponse.fromLanguage}"></span></p>
            <p><strong>From:</strong> <span th:text="${translationResponse.toLanguage}"></span></p>
            <hr/>
            <p><strong>Translated Text:</strong></p>
            <p th:text="${translationResponse.translatedText}"></p>
        </div>
    </div>
    <div class="mt-4">
        <a href="/" class="btn btn-info ml2">View History</a>
    </div>
</div>
</body>
</html>
